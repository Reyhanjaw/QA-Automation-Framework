
name: QA Automation Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  api-tests:
    name: API Automation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run API tests
        run: ./gradlew apiTest
        env:
          DUMMYAPI_APP_ID: ${{ secrets.DUMMYAPI_APP_ID }}

      - name: Upload API reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: build/reports/api-tests/
          if-no-files-found: warn

  web-tests:
    name: Web UI Automation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run Web UI tests
        run: ./gradlew webTest
        env:
          DEMO_USERNAME: ${{ secrets.DEMO_USERNAME }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}

      - name: Upload Web UI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-reports
          path: build/reports/web-tests/
          if-no-files-found: warn
